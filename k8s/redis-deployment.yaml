apiVersion: apps/v1
kind: Deployment
metadata:
  name: ekart-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ekart-redis
  template:
    metadata:
      labels:
        app: ekart-redis
    spec:
      containers:
      - name: ekart-redis
        image: redis:alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: ekart-redis
spec:
  selector:
    app: ekart-redis
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
  type: ClusterIP
